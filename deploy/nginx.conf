# nginx config for the static Next.js export (next build → out/).
# Copy `out/` to the web root below (e.g. `rsync -a out/ pi:/var/www/portfolio/`)
# and install this file as a site (e.g. /etc/nginx/sites-available/portfolio).
#
# HTTP security headers live here because a static export cannot set headers
# from next.config.ts, they were moved verbatim from the old next.config.ts.
#
# TLS note: HSTS and the CSP's `upgrade-insecure-requests` assume the site is
# served over HTTPS. If you serve plain HTTP (e.g. LAN-only on the Pi), remove
# the Strict-Transport-Security line and the `upgrade-insecure-requests`
# directive, or browsers will try to upgrade subresource requests to HTTPS.

# www → apex: the canonical origin is https://gustaffaivre.dev (no www).
# This block needs the same ssl_certificate / ssl_certificate_key lines as
# the main server below (omitted in this reference file) for the redirect
# to work over HTTPS. If Cloudflare terminates TLS in front of nginx, a
# Cloudflare Redirect Rule (www.gustaffaivre.dev/* → apex, 301) is an
# equivalent alternative, use one or the other, not both.
server {
    listen 443 ssl;
    server_name www.gustaffaivre.dev;

    return 301 https://gustaffaivre.dev$request_uri;
}

server {
    listen 443 ssl;
    listen 127.0.0.1:8080;
    server_name gustaffaivre.dev;

    root /var/www/portfolio/out;
    index index.html;

    # ── Security headers (previously next.config.ts → headers()) ──────
    # 'unsafe-inline' on script-src is required: Next.js injects inline
    # hydration scripts and a static export has no per-request nonce.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Static export routing ─────────────────────────────────────────
    # Pages are emitted as /privacy.html, /projects/<slug>.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The export emits the generated favicons without a file extension
    # and nginx mime.types has no .webmanifest mapping, set types by hand.
    location = /icon { default_type image/png; }
    location = /apple-icon { default_type image/png; }
    location = /manifest.webmanifest { default_type application/manifest+json; }

    # Hashed build assets are safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve the generated 404 page for unknown paths.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
